steps:
  # Disable provenance and SBOM attestations so Cloud Run receives a single runnable image manifest.
  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker buildx create --use --name cloud-run-builder &&
        docker buildx build \
          --provenance=false \
          --sbom=false \
          --platform linux/amd64 \
          --tag gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA \
          --push \
          .

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet

substitutions:
  _REGION: asia-east1
  _SERVICE: trojan-web-manager

options:
  logging: CLOUD_LOGGING_ONLY
